appId: com.testmaestrocli
---
- launchApp
# Poll until splash screen dismisses and home screen renders
- extendedWaitUntil:
    visible:
      text: "Welcome to"
    timeout: 30000
- assertVisible:
    text: "Welcome to"
- assertVisible:
    text: "get started"
- tapOn:
    text: "Explore"
- extendedWaitUntil:
    visible:
      text: "Explore"
    timeout: 10000
- assertVisible:
    text: "This starter app includes example"
- tapOn:
    text: "File-based routing"
- assertVisible:
    text: "This app has two screens"
- tapOn:
    text: "Home"
- extendedWaitUntil:
    visible:
      text: "Welcome to"
    timeout: 10000
