appId: com.testmaestrocli
---
- launchApp
- waitForAnimationToEnd:
    timeout: 10000
# Wait for JS bundle to load and splash screen to dismiss
- extendedWaitUntil:
    visible:
      text: "Welcome to"
    timeout: 15000
- assertVisible:
    text: "Welcome to"
- assertVisible:
    text: "get started"
- tapOn:
    text: "Explore"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    text: "Explore"
- assertVisible:
    text: "This starter app includes example"
- tapOn:
    text: "File-based routing"
- assertVisible:
    text: "This app has two screens"
- tapOn:
    text: "Home"
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    text: "Welcome to"
